kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-dsl = { id = "org.jetbrains.kotlin.plugin.gradle", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
greendao = { id = "org.greenrobot.greendao", version.ref = "greendao" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "compose-compiler" }

# ---------- Bundles ----------
[bundles]
kotlinx-coroutines = ["kotlinx-coroutines-android"]
androidx-lifecycle = [
    "androidx-lifecycle-runtime",
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel",
    "androidx-lifecycle-viewmodel-ktx"
]
androidx-room = [
    "androidx-room-runtime",
    "androidx-room-ktx"
]
androidx-fragment = [
    "androidx-fragment",
    "androidx-fragment-ktx"
]
androidx-media = ["androidx-media"]
retrofit = ["retrofit", "retrofit-converter-gson", "retrofit-adapter-coroutines"]
network = ["okhttp", "okhttp-logging-interceptor", "retrofit", "retrofit-converter-gson", "retrofit-adapter-coroutines"]
protobuf-grpc = [
    "protobuf-java",
    "protobuf-kotlin",
    "grpc-netty-shaded",
    "grpc-protobuf",
    "grpc-stub",
    "grpc-kotlin-stub"
]
image = ["glide", "lottie", "lottie-compose"]